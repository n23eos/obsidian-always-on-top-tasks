# Release the Obsidian plugin when a version tag (e.g. "0.1.0", no "v" prefix —
# Obsidian Community Plugins requirement) is pushed.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches manifest versions
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PLUGIN_VERSION=$(node -p "require('./manifest.json').version")
          ROOT_VERSION=$(node -p "require('../manifest.json').version")
          if [ "$TAG" != "$PLUGIN_VERSION" ] || [ "$TAG" != "$ROOT_VERSION" ]; then
            echo "Tag $TAG != plugin manifest $PLUGIN_VERSION or root manifest $ROOT_VERSION"
            echo "Run: npm run bump <version> and re-tag."
            exit 1
          fi

      - name: Create GitHub release with plugin assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" main.js manifest.json styles.css \
            --title "$TAG" --generate-notes
